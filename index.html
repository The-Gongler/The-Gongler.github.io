function tutorial(){ov(`<div class="notes"><h1>Guild Notes</h1><p class="ns">Gathered by the hunters who came before you. Read it. Then live.</p><h2>The Basics</h2><div class="en"><svg viewBox="0 0 120 90"><circle cx="60" cy="45" r="36" stroke-dasharray="5 4"/><circle cx="60" cy="45" r="14"/><path d="M18 74 Q58 40 100 24"/><path d="M90 20 L101 24 L95 34"/></svg><div><b>Parry</b><p>A parry is a perfectly timed deflection. When a dragon winds up, a ring closes in on a centre mark and an arrow shows which way to strike. Wait until the ring burns green, then swipe (or press the matching arrow key) in that direction. A clean parry stuns the beast and leaves it open to your blade.</p><p class="hand">Too early and it counts as a mistake. Patience.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><circle cx="60" cy="45" r="36" stroke-dasharray="5 4"/><path d="M60 22 L82 30 L80 54 Q60 72 40 54 L38 30Z"/><path d="M60 30 V58 M48 42 H72"/></svg><div><b>Block ring</b><p>A ring marked BLOCK means a blast or breath that cannot be turned aside. Tap or press Space just as the ring closes to raise your guard. Dodge and jump rings work the same way: strike the centre at the exact moment.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><path d="M22 74 L92 12 L100 20 L34 82Z"/><path d="M28 62 L44 78"/><path d="M100 10 L112 2 M106 24 L118 24"/></svg><div><b>Your sword</b><p>Space is your sword. Once a dragon is stunned, tap or press Space as fast as you can; a swipe cuts as well. Every strike channels a little mana, and unbroken strikes build a combo.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><circle cx="76" cy="40" r="16"/><path d="M60 40 Q30 36 10 56 M60 32 Q34 20 14 24 M62 48 Q40 64 22 78"/><path d="M76 30 Q70 22 78 14 Q84 22 82 30"/></svg><div><b>Fireball</b><p>F is the fireball. It hits harder than any blade and burns mana, which your sword, your parries and the passing seconds all feed. Watch the blue bar: each white tick is one fireball. Keep them for the moments when steel will not bite.</p></div></div><h2>Sketches of Dragon Attacks</h2><p class="hand">Found in a dead explorer's journal. The ink is smudged, but every warning held true.</p><div class="en"><svg viewBox="0 0 120 90"><path d="M26 10 Q54 30 48 80"/><path d="M44 8 Q74 30 66 82"/><path d="M62 8 Q94 30 84 84"/><path d="M14 70 L20 84 L32 76"/></svg><div><b>Claw sweeps</b><p>Claws rake across from one side. Swipe against the sweep, exactly as the arrow shows.</p><p class="hand">Watch which shoulder drops first.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><path d="M10 34 Q60 -6 110 34 L98 34 L92 46 L82 34 L72 48 L62 34 L52 48 L42 34 L32 46 L26 34Z"/><path d="M14 62 Q60 96 106 62 L96 62 L90 50 L80 62 L70 48 L60 62 L50 48 L40 62 L30 50 L24 62Z"/></svg><div><b>Bites and slams</b><p>Jaws that snap down from above are answered with an upward swipe. A heavy slam is answered with a downward one. Some armoured beasts need two clean swipes in a row.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><path d="M8 34 L30 45 L8 56Z"/><path d="M34 45 L50 28 L56 40 L72 18 L76 36 L96 14 L96 38 L114 30 L102 48 L116 62 L92 56 L98 78 L74 62 L64 82 L54 58 L40 70Z"/></svg><div><b>Breath</b><p>Fire gathers in the throat and the ring reads BLOCK. Do not try to parry flame. Raise your guard and hold your nerve.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><path d="M16 26 H68 M28 16 L16 26 L28 36" stroke-dasharray="4 4"/><path d="M104 62 H52 M92 52 L104 62 L92 72"/><path d="M60 16 L76 36 M76 16 L60 36"/></svg><div><b>Feints</b><p>Some dragons lie with their bodies. The arrow changes in the middle of the wind-up. Keep your hand still until the final arrow settles, then act.</p><p class="hand">Never trust the first arrow.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><path d="M6 45 H114"/><circle cx="46" cy="45" r="9"/><path d="M16 28 L6 45 L16 62 M104 28 L114 45 L104 62"/></svg><div><b>Tug of war</b><p>Some beasts seize hold and haul. A rope bar shows who is winning. Mash Space (or tap) to drag the marker to your side before it runs out. Lose the tug and the blow lands in full.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><circle cx="60" cy="45" r="8"/><circle cx="60" cy="45" r="20" stroke-dasharray="3 4"/><circle cx="60" cy="45" r="32" stroke-dasharray="3 6"/><path d="M60 80 V58 M52 66 L60 58 L68 66"/></svg><div><b>Mashing</b><p>Some attacks can only be broken by raw speed. Tap as fast as your fingers allow until the gauge fills.</p></div></div><div class="en"><svg viewBox="0 0 120 90"><text x="60" y="52" text-anchor="middle" font-size="28" fill="#3a2a18" stroke="none" style="font-family:'IM Fell English',Georgia,serif;letter-spacing:4px">EMBER</text><path d="M12 62 Q30 70 48 62 T84 62 T108 62"/></svg><div><b>Incantations</b><p>Words of power burn across the screen. Type them out letter by letter. These are called Incantations. A wrong letter costs you a full second of your guard, so do not rush blindly.</p></div></div><h2>Rules of the Hunt</h2><p>Fall three times to the same dragon and the hunt is lost: your gear, gold and relics are gone, though the dragons you have slain stay on the map. Between fights you may buy relics (the first is free, five at most until the False Dragon God falls; it leaves one free gift and raises the limit to eight). Press Esc at any time for the menu. Beat Tier 100 and Endless Mode opens: random dragons with random prefixes, a stronger boss every 50 levels, and no relic limit.</p></div><button class="go alt" id="bk">Close notes</button>`)}
